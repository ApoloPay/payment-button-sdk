name: Publish Javascript SDK

on:
  push:
    branches:
      - deploy/javascript
  pull_request:
    branches:
      - deploy/javascript
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and Publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    defaults:
      run:
        working-directory: javascript-sdk
    steps:
      - name: Checkout Repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@a3252b78c470c02df07e9d59298aecedc3ccdd6d # v3
        # No version here: it's "packageManager" in javascript-sdk/package.json.
        with:
          package_json_file: javascript-sdk/package.json

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'

      # Exactly the committed lockfile: a publish never picks up a dependency
      # version nobody reviewed (supply-chain attacks ship as new versions).
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

      - name: Create Release Pull Request or Publish to npm
        id: changesets
        uses: changesets/action@e9cc34b540dd3ad1b030c57fd97269e8f6ad905a # v1.4.1
        with:
          publish: pnpm run release
          cwd: javascript-sdk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: true

      - name: Generate WordPress Plugin ZIP
        if: steps.changesets.outputs.published == 'true'
        run: |
          pnpm run build --filter=@nexora-smartpay/wordpress-plugin
          # Released alongside the SDK it bundles: the asset/tag carry the SDK version.
          PACKAGE_VERSION=$(node -p "require('./packages/ui/package.json').version")
          # The zip holds a single apolopay-checkout-for-woocommerce/ folder, so
          # WordPress installs it under that slug whatever the asset is named.
          mv packages/wordpress/dist/apolopay-checkout-for-woocommerce.zip packages/wordpress/dist/nexora-smartpay-for-woocommerce-v$PACKAGE_VERSION.zip
          echo "WP_VERSION=$PACKAGE_VERSION" >> $GITHUB_ENV

      - name: Upload WordPress ZIP to GitHub Release
        if: steps.changesets.outputs.published == 'true'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: javascript-sdk/packages/wordpress/dist/nexora-smartpay-for-woocommerce-v${{ env.WP_VERSION }}.zip
          tag_name: WordPress-v${{ env.WP_VERSION }}
          name: "WordPress Release v${{ env.WP_VERSION }}"
          append_body: true
          body: |
            ---
            ### 🔌 WordPress Integration (Nexora SmartPay for WooCommerce)
            - **Plugin Version:** v${{ env.WP_VERSION }}
            - **Installation:** Download the `nexora-smartpay-for-woocommerce-v${{ env.WP_VERSION }}.zip` below and upload it to your WordPress admin panel. It installs (and updates) the `apolopay-checkout-for-woocommerce` plugin in place.
            - **Before updating to 2.x:** set the Webhook Secret in the plugin settings, or the payment method is hidden at checkout.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
