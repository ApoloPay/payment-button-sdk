name: Publish Flutter SDK

on:
  push:
    branches:
      - deploy/dart
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dart_sdk
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        # Pinned: the tests that gate a pub.dev release run on a known Flutter,
        # not whatever stable is that day. The package itself still accepts
        # any Flutter its pubspec allows.
        with:
          channel: stable
          flutter-version: '3.47.9'
      - run: flutter pub get
      - run: flutter test

  publish:
    needs: test
    permissions:
      id-token: write
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@2286a0c042b44434fe26d292bbce8d34f7ec662b # v1
    with:
      working-directory: dart_sdk
