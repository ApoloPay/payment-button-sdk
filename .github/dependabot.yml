# Keeps the SHA-pinned GitHub Actions up to date. New releases are only
# proposed after 14 days, the same quarantine the package managers use.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14

  # The Flutter package's own dependencies (and its example app's), same
  # 14-day quarantine.
  - package-ecosystem: pub
    directories: [/dart_sdk, /dart_sdk/example]
    target-branch: develop
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    open-pull-requests-limit: 5
