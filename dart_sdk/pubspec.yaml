name: nexora_smartpay_sdk
description: Nexora SmartPay SDK for Flutter. Drop-in crypto payment button and checkout modal (formerly apolopay_sdk).
version: 2.0.0
homepage: https://smartpaylatam.com
repository: https://github.com/Nexora-SmartPay/nexora_smartpay_sdk
issue_tracker: https://github.com/Nexora-SmartPay/nexora_smartpay_sdk/issues

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.5.0
  socket_io_client: ^3.1.4
  qr_flutter: ^4.1.0
  intl: ^0.18.1
  cached_network_image: ^3.4.1
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 2.0.0
